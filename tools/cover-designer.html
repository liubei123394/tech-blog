<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公众号封面设计器 · DevNotes</title>
<style>
  :root { --line: #e2e8f0; --txt: #0f172a; --sub: #64748b; --acc: #2563eb; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px 20px 60px; background: #f1f5f9; color: var(--txt);
         font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  .wrap { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: 380px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 960px) { .wrap { grid-template-columns: 1fr; } }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { font-size: 13px; color: var(--sub); margin: 0 0 20px; line-height: 1.7; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
  label:first-child { margin-top: 0; }
  label small { font-weight: 400; color: var(--sub); }
  input[type="text"], textarea, select, input[type="date"] {
    width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 14px; font-family: inherit; background: #f8fafc; color: var(--txt);
  }
  textarea { resize: vertical; min-height: 64px; line-height: 1.6; }
  input:focus, textarea:focus, select:focus { outline: 2px solid #bfdbfe; border-color: var(--acc); }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .color-row { display: flex; align-items: center; gap: 10px; }
  .color-row input[type="color"] { width: 46px; height: 38px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; }
  .color-row .hint { font-size: 12px; color: var(--sub); }
  .btns { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  button { padding: 10px 16px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
           cursor: pointer; font-family: inherit; transition: filter .15s; }
  button:hover { filter: brightness(1.08); }
  .btn-primary { background: var(--acc); color: #fff; }
  .btn-green { background: #059669; color: #fff; }
  .btn-ghost { background: #eef2ff; color: #4338ca; }
  .preview-box { position: sticky; top: 20px; }
  .preview-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; color: var(--sub); }
  .preview-meta b { color: var(--txt); }
  .preview-frame { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff; box-shadow: 0 2px 10px rgba(15,23,42,.06); }
  .preview-frame svg { display: block; width: 100%; height: auto; }
  .tips { margin-top: 12px; font-size: 12px; color: var(--sub); line-height: 1.8; }
  #png-tip { color: #059669; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>公众号封面设计器</h1>
    <p class="sub">内置 2.35:1（1800×766）公众号头条封面模板，与 <code>npm run sync</code> 的自动封面同款模板。<br>支持直接双击打开本文件使用；也可带参数预填：<code>?title=标题&amp;summary=摘要&amp;tags=a,b</code></p>

    <div class="panel">
      <label>文章标题 <small>（超长自动换行/缩放）</small></label>
      <textarea id="title">用零依赖 Node 脚本把 Markdown 编译成静态博客</textarea>

      <label>摘要 <small>（选填，最多两行）</small></label>
      <textarea id="summary">不依赖任何框架，200 行代码搞定构建、RSS 与 SEO，记录一次完整的造轮子过程。</textarea>

      <label>标签 <small>（英文逗号分隔，最多 3 个）</small></label>
      <input type="text" id="tags" value="Node, 静态博客">

      <div class="row">
        <div>
          <label>日期</label>
          <input type="text" id="date" value="2026-10-22">
        </div>
        <div>
          <label>品牌名 / 站点名</label>
          <input type="text" id="brand" value="DevNotes">
        </div>
      </div>

      <label>封面模板</label>
      <select id="template">
        <option value="auto">自动（按内容挑选，同一篇恒定）</option>
        <option value="aurora">极光（深蓝紫渐变）</option>
        <option value="mint">薄荷（清新浅绿）</option>
        <option value="sunset">落日（橙粉渐变）</option>
        <option value="ink">纸墨（极简白）</option>
        <option value="code">终端（深色代码风）</option>
      </select>

      <label>主题色 <small>（选填，覆盖模板默认点缀色）</small></label>
      <div class="color-row">
        <input type="color" id="accent" value="#22d3ee">
        <span class="hint">留空/不动则使用各模板默认配色</span>
      </div>

      <div class="btns">
        <button class="btn-primary" id="dl-png">⬇️ 导出 PNG（1800×766）</button>
        <button class="btn-green" id="dl-svg">导出 SVG</button>
        <button class="btn-ghost" id="reroll">🎲 换一批花样</button>
      </div>
      <p class="tips" id="png-tip"></p>
    </div>
  </div>

  <div class="preview-box">
    <div class="preview-meta">
      <span>实时预览 · <b id="tpl-name">—</b></span>
      <span>1800 × 766（2.35:1）</span>
    </div>
    <div class="preview-frame" id="preview"></div>
    <p class="tips">导出后到公众号后台「图文消息 → 封面」手动上传即可；自动同步场景下，<code>npm run sync</code> 会直接生成并绑定封面，无需手动操作。</p>
  </div>
</div>

<script>
/* =====================================================================
 * 封面模板渲染逻辑 —— 与 scripts/lib/cover-svg.mjs 保持同一份实现。
 * ⚠️ 若修改模板，务必两处同步更新（本页内嵌副本用于浏览器双击打开）。
 * ===================================================================== */
const COVER_W = 1800, COVER_H = 766;
const TEMPLATE_IDS = ['aurora', 'mint', 'sunset', 'ink', 'code'];
const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ESC_MAP[c]);
const FONT = "-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif";
const MONO = "'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace";
const isCJK = (ch) => /[\u2E80-\u9FFF\uF900-\uFAFF\uFF00-\uFFEF\u3000-\u303F]/.test(ch);
function charW(ch, size) {
  if (isCJK(ch)) return size;
  if (/[A-Z0-9@#%&MW]/.test(ch)) return size * 0.66;
  if (/\s/.test(ch)) return size * 0.3;
  if ('iljtf.,:;|!()[]\'"'.includes(ch)) return size * 0.34;
  return size * 0.55;
}
const textW = (s, size) => { let w = 0; for (const ch of String(s)) w += charW(ch, size); return w; };
function tokenize(text) {
  const units = []; let buf = '';
  for (const ch of String(text)) {
    if (isCJK(ch) || ch === ' ') { if (buf) { units.push(buf); buf = ''; } units.push(ch); }
    else buf += ch;
  }
  if (buf) units.push(buf);
  return units;
}
function wrapText(text, size, maxW, maxLines) {
  const lines = []; let cur = '';
  for (const u of tokenize(String(text || '').trim())) {
    const cand = cur + u;
    if (cur && textW(cand, size) > maxW) { lines.push(cur); cur = u.trimStart(); }
    else cur = cand;
  }
  if (cur.trim()) lines.push(cur);
  if (lines.length > maxLines) {
    const kept = lines.slice(0, maxLines);
    let last = kept[maxLines - 1];
    while (last && textW(last + '…', size) > maxW) last = last.slice(0, -1);
    kept[maxLines - 1] = last + '…';
    return kept;
  }
  return lines;
}
function fitLines(text, sizes, maxW, maxLines) {
  for (const s of sizes) {
    const lines = wrapText(text, s, maxW, maxLines);
    if (lines.length <= maxLines && !lines[lines.length - 1].endsWith('…')) return { size: s, lines };
  }
  const s = sizes[sizes.length - 1];
  return { size: s, lines: wrapText(text, s, maxW, maxLines) };
}
function hashSeed(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const THEMES = {
  aurora: {
    title: '#ffffff', summary: 'rgba(255,255,255,.78)', meta: 'rgba(255,255,255,.6)',
    pillBg: 'rgba(255,255,255,.14)', pillLine: 'rgba(255,255,255,.28)', pillText: '#e0e7ff',
    brand: 'rgba(255,255,255,.66)', accent: '#22d3ee',
    deco: (id, rnd, accent) => {
      const x = 1300 + Math.floor(rnd() * 260), y = -60 + Math.floor(rnd() * 140);
      return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#312e81"/><stop offset=".55" stop-color="#6d28d9"/><stop offset="1" stop-color="#1d4ed8"/>
</linearGradient></defs>
<rect width="${COVER_W}" height="${COVER_H}" fill="url(#${id})"/>
<circle cx="${x}" cy="${y}" r="${300 + Math.floor(rnd() * 120)}" fill="rgba(255,255,255,.07)"/>
<circle cx="${140 + Math.floor(rnd() * 120)}" cy="${620 + Math.floor(rnd() * 90)}" r="${180 + Math.floor(rnd() * 80)}" fill="rgba(255,255,255,.05)"/>
<circle cx="${1520 + Math.floor(rnd() * 120)}" cy="${560 + Math.floor(rnd() * 100)}" r="10" fill="${accent}" opacity=".85"/>
<circle cx="${1620 + Math.floor(rnd() * 90)}" cy="${480 + Math.floor(rnd() * 80)}" r="6" fill="rgba(255,255,255,.5)"/>`;
    },
  },
  mint: {
    title: '#064e3b', summary: '#475569', meta: '#94a3b8',
    pillBg: '#d1fae5', pillLine: '#a7f3d0', pillText: '#047857',
    brand: '#94a3b8', accent: '#10b981',
    deco: (id, rnd, accent) => {
      const bx = 1350 + Math.floor(rnd() * 200);
      return `<rect width="${COVER_W}" height="${COVER_H}" fill="#f0fdf9"/>
<radialGradient id="${id}" cx=".5" cy=".5" r=".5">
<stop offset="0" stop-color="#a7f3d0" stop-opacity=".55"/><stop offset="1" stop-color="#a7f3d0" stop-opacity="0"/>
</radialGradient>
<circle cx="${bx}" cy="${60 + Math.floor(rnd() * 100)}" r="${420 + Math.floor(rnd() * 120)}" fill="url(#${id})"/>
<circle cx="${120 + Math.floor(rnd() * 100)}" cy="${640 + Math.floor(rnd() * 70)}" r="${220 + Math.floor(rnd() * 80)}" fill="url(#${id})"/>`;
    },
  },
  sunset: {
    title: '#ffffff', summary: 'rgba(255,255,255,.88)', meta: 'rgba(255,255,255,.7)',
    pillBg: 'rgba(255,255,255,.2)', pillLine: 'rgba(255,255,255,.35)', pillText: '#fff7ed',
    brand: 'rgba(255,255,255,.72)', accent: '#fde047',
    deco: (id, rnd, accent) => {
      const cx = 1450 + Math.floor(rnd() * 180), cy = 120 + Math.floor(rnd() * 120);
      return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#f472b6"/><stop offset=".5" stop-color="#fb7185"/><stop offset="1" stop-color="#fb923c"/>
</linearGradient></defs>
<rect width="${COVER_W}" height="${COVER_H}" fill="url(#${id})"/>
<circle cx="${cx}" cy="${cy}" r="${340 + Math.floor(rnd() * 120)}" fill="rgba(255,255,255,.1)"/>
<circle cx="${100 + Math.floor(rnd() * 90)}" cy="${640 + Math.floor(rnd() * 80)}" r="${200 + Math.floor(rnd() * 90)}" fill="rgba(255,255,255,.08)"/>
<circle cx="${1580 + Math.floor(rnd() * 80)}" cy="${600 + Math.floor(rnd() * 80)}" r="9" fill="${accent}" opacity=".9"/>`;
    },
  },
  ink: {
    title: '#0f172a', summary: '#475569', meta: '#94a3b8',
    pillBg: '#e2e8f0', pillLine: '#cbd5e1', pillText: '#475569',
    brand: '#0f172a', accent: '#ef4444',
    deco: (id, rnd, accent) => {
      const x = 1560 + Math.floor(rnd() * 100), y = 80 + Math.floor(rnd() * 90);
      return `<rect width="${COVER_W}" height="${COVER_H}" fill="#fafafa"/>
<rect x="0" y="0" width="${COVER_W}" height="10" fill="${accent}"/>
<rect x="${x}" y="${y}" width="46" height="46" fill="${accent}" transform="rotate(${8 + Math.floor(rnd() * 20)} ${x + 23} ${y + 23})" opacity=".9"/>
<circle cx="${140 + Math.floor(rnd() * 80)}" cy="${660 + Math.floor(rnd() * 50)}" r="6" fill="#cbd5e1"/>`;
    },
  },
  code: {
    title: '#f0f6fc', summary: '#8b949e', meta: '#8b949e',
    pillBg: '#161b22', pillLine: '#30363d', pillText: '#7ee787',
    brand: '#8b949e', accent: '#2f81f7',
    deco: (id, rnd, accent) => {
      return `<rect width="${COVER_W}" height="${COVER_H}" fill="#0d1117"/>
<rect x="0" y="0" width="${COVER_W}" height="120" fill="#010409" opacity=".6"/>
<circle cx="96" cy="54" r="14" fill="#ff5f56"/><circle cx="140" cy="54" r="14" fill="#ffbd2e"/><circle cx="184" cy="54" r="14" fill="#27c93f"/>
<rect x="0" y="${COVER_H - 8}" width="${COVER_W}" height="8" fill="${accent}"/>
<rect x="1490" y="${200 + Math.floor(rnd() * 160)}" width="180" height="3" fill="#30363d"/>
<rect x="1560" y="${260 + Math.floor(rnd() * 160)}" width="120" height="3" fill="#21262d"/>`;
    },
  },
};
function buildCoverSVG(options = {}) {
  const { title = '文章标题', summary = '', tags = [], date = '', brand = 'DevNotes',
          template = 'auto', accent = '', variant = 0, seedKey = '' } = options;
  const key = seedKey || String(title) + String(variant);
  const tid = TEMPLATE_IDS.includes(template) ? template
    : TEMPLATE_IDS[hashSeed(key) % TEMPLATE_IDS.length];
  const theme = THEMES[tid];
  const PAD = 96, maxW = COVER_W - PAD * 2;
  const accentColor = accent || theme.accent;
  const fit = fitLines(title, [104, 92, 80, 70, 62], maxW, 2);
  const titleSize = fit.size, titleLH = titleSize * 1.26;
  const sumLines = summary ? wrapText(summary, 36, maxW, 2) : [];
  const sumLH = 36 * 1.55;
  const metaH = 120;
  const blockH = fit.lines.length * titleLH + (sumLines.length ? 34 + sumLines.length * sumLH : 0);
  let y = Math.round((COVER_H - metaH - blockH) / 2 + titleSize);
  y = Math.max(y, titleSize + 20);
  const parts = [];
  const gid = `g${hashSeed(tid + key + variant).toString(36)}`;
  const rnd = rng(hashSeed(key + variant));
  parts.push(theme.deco(gid, rnd, accentColor));
  let textX = PAD;
  if (tid === 'mint') {
    parts.push(`<rect x="${PAD}" y="${Math.round(y - titleSize * 0.92)}" width="12" height="${Math.round(blockH * 0.92)}" rx="6" fill="${accentColor}"/>`);
    textX = PAD + 40;
  }
  if (tid === 'code' && tags.length) {
    const commentY = Math.max(y - titleLH - 18, 112);
    parts.push(`<text x="${textX}" y="${commentY}" font-family="${MONO}" font-size="30" fill="#7ee787">// ${esc(tags.slice(0, 4).join(' · '))}</text>`);
  }
  for (let i = 0; i < fit.lines.length; i++) {
    parts.push(`<text x="${textX}" y="${Math.round(y + i * titleLH)}" font-family="${FONT}" font-size="${titleSize}" font-weight="700" fill="${theme.title}">${esc(fit.lines[i])}</text>`);
  }
  let sy = y + (fit.lines.length - 1) * titleLH + 34 + 36;
  for (const line of sumLines) {
    parts.push(`<text x="${textX}" y="${Math.round(sy)}" font-family="${FONT}" font-size="36" fill="${theme.summary}">${esc(line)}</text>`);
    sy += sumLH;
  }
  const metaY = COVER_H - 66;
  let mx = textX;
  if (date) {
    parts.push(`<text x="${mx}" y="${metaY}" font-family="${FONT}" font-size="30" fill="${theme.meta}">${esc(date)}</text>`);
    mx += textW(date, 30) + 28;
  }
  if (tags.length && tid !== 'code') {
    for (const tag of tags.slice(0, 3)) {
      const t = String(tag).slice(0, 12);
      const pw = Math.round(textW(t, 28) + 44);
      parts.push(`<rect x="${Math.round(mx)}" y="${metaY - 38}" width="${pw}" height="48" rx="24" fill="${theme.pillBg}" stroke="${theme.pillLine}" stroke-width="1.5"/>`);
      parts.push(`<text x="${Math.round(mx + 22)}" y="${metaY}" font-family="${FONT}" font-size="28" fill="${theme.pillText}">${esc(t)}</text>`);
      mx += pw + 16;
    }
  }
  if (brand) {
    const bw = textW(brand, 32);
    parts.push(`<text x="${COVER_W - PAD - bw}" y="${metaY}" font-family="${FONT}" font-size="32" font-weight="600" fill="${theme.brand}">${esc(brand)}</text>`);
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${COVER_W}" height="${COVER_H}" viewBox="0 0 ${COVER_W} ${COVER_H}">\n${parts.join('\n')}\n</svg>`;
  return { svg, template: tid };
}
/* ============================ 页面交互逻辑 ============================ */
const $ = (id) => document.getElementById(id);
let variant = 0;
function currentOptions() {
  return {
    title: $('title').value.trim() || '文章标题',
    summary: $('summary').value.trim(),
    tags: $('tags').value.split(/[,，]/).map((s) => s.trim()).filter(Boolean),
    date: $('date').value.trim(),
    brand: $('brand').value.trim(),
    template: $('template').value,
    accent: $('accent').value || '',
    variant,
  };
}
function render() {
  const { svg, template } = buildCoverSVG(currentOptions());
  $('preview').innerHTML = svg;
  const labels = { aurora: '极光', mint: '薄荷', sunset: '落日', ink: '纸墨', code: '终端' };
  $('tpl-name').textContent = (labels[template] || template) + ' 模板';
}
function fileBase() {
  const t = $('title').value.trim().replace(/[\\/:*?"<>|\s]+/g, '-').replace(/^-+|-+$/g, '');
  return (t || 'cover').slice(0, 40);
}
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
$('dl-png').addEventListener('click', () => {
  const { svg } = buildCoverSVG(currentOptions());
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = COVER_W; canvas.height = COVER_H;
    canvas.getContext('2d').drawImage(img, 0, 0, COVER_W, COVER_H);
    canvas.toBlob((blob) => {
      if (!blob) { $('png-tip').textContent = '导出失败，请换 Chrome/Edge 再试'; return; }
      download(blob, fileBase() + '-cover.png');
      $('png-tip').textContent = '✅ PNG 已导出，去公众号后台「封面」处上传';
    }, 'image/png');
  };
  img.onerror = () => { $('png-tip').textContent = '渲染失败：请确认没有特殊字符'; };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
});
$('dl-svg').addEventListener('click', () => {
  const { svg } = buildCoverSVG(currentOptions());
  download(new Blob([svg], { type: 'image/svg+xml' }), fileBase() + '-cover.svg');
});
$('reroll').addEventListener('click', () => { variant++; render(); });
['title', 'summary', 'tags', 'date', 'brand', 'template', 'accent'].forEach((id) => {
  $(id).addEventListener('input', render);
  $(id).addEventListener('change', render);
});
// 支持 ?title=&summary=&tags=&date=&brand=&template=&accent= 预填
const q = new URLSearchParams(location.search);
for (const [k, id] of [['title', 'title'], ['summary', 'summary'], ['tags', 'tags'], ['date', 'date'], ['brand', 'brand'], ['template', 'template'], ['accent', 'accent']]) {
  if (q.get(k)) $(id).value = q.get(k);
}
render();
</script>
</body>
</html>
